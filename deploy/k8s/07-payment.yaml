# Пробы и ресурсы — тем же смыслом, что у gateway (см. 03-gateway.yaml).
# PAYMENT_PROVIDER=fake (из ConfigMap) — демо-режим, деньги не списываются (ADR 0004).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: seatlock
  labels:
    app: payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment
  template:
    metadata:
      labels:
        app: payment
    spec:
      containers:
        - name: payment
          image: seatlock/payment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          envFrom:
            - configMapRef:
                name: seatlock-config
            - secretRef:
                name: seatlock-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3004
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment
  namespace: seatlock
spec:
  selector:
    app: payment
  ports:
    - port: 3004
      targetPort: 3004
