# Пробы и ресурсы — тем же смыслом, что у gateway (см. 03-gateway.yaml). У notification
# нет своего Ingress/трафика снаружи — HTTP только для /health, /health/ready, /metrics,
# основная работа — консьюмер RabbitMQ (order-paid.consumer.ts). 2 реплики безопасны
# благодаря атомарному захвату заказа (claim(), ADR 0002/0006): дубль сообщения не
# отправит письмо дважды.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  namespace: seatlock
  labels:
    app: notification
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification
  template:
    metadata:
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: seatlock/notification:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005
          envFrom:
            - configMapRef:
                name: seatlock-config
            - secretRef:
                name: seatlock-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3005
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: notification
  namespace: seatlock
spec:
  selector:
    app: notification
  ports:
    - port: 3005
      targetPort: 3005
