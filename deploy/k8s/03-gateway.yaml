# Единственный сервис с Ingress перед собой — снаружи кластера виден только он,
# ровно тот же принцип, что и в проде (Caddy → gateway → остальные, ADR 0007).
# 2 реплики: сюда попадает весь входящий трафик, и на них удобнее всего увидеть
# балансировку Service (см. deploy/k8s/README.md, раздел "Проверка балансировки").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: seatlock
  labels:
    app: gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: seatlock/gateway:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: seatlock-config
            - secretRef:
                name: seatlock-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          # Совпадает по смыслу с Docker HEALTHCHECK в Dockerfile: liveness — сам
          # процесс жив; readiness (у сервисов с зависимостями) — готов принимать
          # трафик. У gateway readiness тоже дергает Postgres/Redis (health.service.ts),
          # поэтому readinessProbe строже livenessProbe.
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: seatlock
spec:
  selector:
    app: gateway
  ports:
    - port: 3000
      targetPort: 3000
