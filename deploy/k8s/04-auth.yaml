# Пробы и ресурсы — тем же смыслом, что у gateway (см. 03-gateway.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: seatlock
  labels:
    app: auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: seatlock/auth:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
          envFrom:
            - configMapRef:
                name: seatlock-config
            - secretRef:
                name: seatlock-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: seatlock
spec:
  selector:
    app: auth
  ports:
    - port: 3001
      targetPort: 3001
