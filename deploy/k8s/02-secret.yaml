# Значения — те же dev-заглушки, что уже открыто лежат в .env.example (seatlock/seatlock
# и т. п.), не боевые секреты. Отдельный Secret, а не ConfigMap, только ради практики:
# в проде (docker-compose.prod.yml) те же поля идут через переменные окружения из GitHub
# Actions Secrets и .env на сервере, сюда никогда не попадают.
apiVersion: v1
kind: Secret
metadata:
  name: seatlock-secret
  namespace: seatlock
type: Opaque
stringData:
  JWT_ACCESS_SECRET: dev-access-secret-change-me
  JWT_REFRESH_SECRET: dev-refresh-secret-change-me

  # Тот же Postgres, что у dev-стека (docker-compose.yml) — своя схема на сервис
  # (ADR 0001), тот же приём, что везде в проекте.
  DATABASE_URL: postgresql://seatlock:seatlock@host.docker.internal:5433/seatlock
  AUTH_DATABASE_URL: postgresql://seatlock:seatlock@host.docker.internal:5433/seatlock?schema=auth
  CATALOG_DATABASE_URL: postgresql://seatlock:seatlock@host.docker.internal:5433/seatlock?schema=catalog
  PAYMENT_DATABASE_URL: postgresql://seatlock:seatlock@host.docker.internal:5433/seatlock?schema=payment
  NOTIFICATION_DATABASE_URL: postgresql://seatlock:seatlock@host.docker.internal:5433/seatlock?schema=notification

  REDIS_URL: redis://host.docker.internal:6380
  RABBITMQ_URL: amqp://seatlock:seatlock@host.docker.internal:5673

  S3_ACCESS_KEY: seatlock
  S3_SECRET_KEY: seatlock123
