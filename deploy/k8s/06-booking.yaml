# Пробы и ресурсы — тем же смыслом, что у gateway (см. 03-gateway.yaml). У booking
# нет своей БД (холды только в Redis, ADR 0003), поэтому DATABASE_URL из Secret
# ему не нужен — он просто не читает соответствующую переменную.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking
  namespace: seatlock
  labels:
    app: booking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: booking
  template:
    metadata:
      labels:
        app: booking
    spec:
      containers:
        - name: booking
          image: seatlock/booking:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
            - configMapRef:
                name: seatlock-config
            - secretRef:
                name: seatlock-secret
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3003
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: booking
  namespace: seatlock
spec:
  selector:
    app: booking
  ports:
    - port: 3003
      targetPort: 3003
