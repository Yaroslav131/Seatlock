name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон —
# незачем занимать раннеры проверкой устаревшего кода.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линтер, типы, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Нужен только тестам booking (holds.lua.integration.spec.ts) — это
    # единственный пакет в монорепе, чей тест бьёт в настоящий Redis, а не
    # мок, потому что сама атомарность холдов живёт внутри Lua-скрипта,
    # а не в TS-коде (см. docs/adr/0003). Остальные пакеты как гоняли
    # моки, так и продолжат — реальный Redis им не нужен, просто он
    # теперь есть рядом.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager в package.json —
      # локально и в CI работает ровно одна и та же.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: если lock-файл разошёлся с package.json,
      # сборка падает вместо того, чтобы тихо поставить другие версии.
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Форматирование
        run: pnpm format:check

      - name: Линтер
        run: pnpm lint

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build
