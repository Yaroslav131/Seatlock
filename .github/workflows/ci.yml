name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Новый пуш в ту же ветку отменяет предыдущий прогон —
# незачем занимать раннеры проверкой устаревшего кода.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Линтер, типы, сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Нужны интеграционным *.integration.spec.ts-тестам (booking, gateway,
    # auth, catalog) — юнит-тесты на моках их не трогают вообще. Реальная
    # инфраструктура нужна там, где сама логика живёт не в TS: атомарность
    # холдов в Lua-скрипте Redis (см. docs/adr/0003), а не мок redis.eval;
    # RolesGuard/ValidationPipe/ThrottlerGuard на настоящем HTTP-запросе,
    # а не то, что мок сервиса согласился вернуть.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
          POSTGRES_DB: seatlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatlock -d seatlock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      # Своя схема на каждый сервис в одном и том же инстансе Postgres —
      # см. docs/adr/0001, тот же приём, что и в .env.example локально.
      AUTH_DATABASE_URL: postgresql://seatlock:seatlock@localhost:5432/seatlock?schema=auth
      CATALOG_DATABASE_URL: postgresql://seatlock:seatlock@localhost:5432/seatlock?schema=catalog

    steps:
      - uses: actions/checkout@v4

      # Версия pnpm берётся из поля packageManager в package.json —
      # локально и в CI работает ровно одна и та же.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile: если lock-файл разошёлся с package.json,
      # сборка падает вместо того, чтобы тихо поставить другие версии.
      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      # Отдельным шагом, до pnpm test — иначе auth.integration.spec.ts/
      # catalog.integration.spec.ts падают на первом же запросе к пустой
      # базе без таблиц вообще.
      - name: Применить миграции к тестовым базам
        run: |
          pnpm --filter @seatlock/auth run prisma:deploy
          pnpm --filter @seatlock/catalog run prisma:deploy

      - name: Форматирование
        run: pnpm format:check

      - name: Линтер
        run: pnpm lint

      - name: Проверка типов
        run: pnpm typecheck

      - name: Тесты
        run: pnpm test

      - name: Сборка
        run: pnpm build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Запас под холодную ts-node-компиляцию 4 nest-приложений + Vite
    # параллельно на раннере — см. комментарий у шага ожидания ниже.
    timeout-minutes: 20

    # Свой job, не шаг в check: поднимает весь стек живьём (5 процессов
    # через pnpm dev), а не отдельные *.spec.ts внутри одного пакета —
    # смешивать это с линтером/сборкой только замедлило бы обратную
    # связь по самым дешёвым и частым проверкам.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: seatlock
          POSTGRES_PASSWORD: seatlock
          POSTGRES_DB: seatlock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seatlock -d seatlock"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://seatlock:seatlock@localhost:5432/seatlock
      AUTH_DATABASE_URL: postgresql://seatlock:seatlock@localhost:5432/seatlock?schema=auth
      CATALOG_DATABASE_URL: postgresql://seatlock:seatlock@localhost:5432/seatlock?schema=catalog
      JWT_ACCESS_SECRET: ci-e2e-access-secret
      JWT_REFRESH_SECRET: ci-e2e-refresh-secret
      AUTH_SERVICE_URL: http://localhost:3001
      CATALOG_SERVICE_URL: http://localhost:3002
      BOOKING_SERVICE_URL: http://localhost:3003
      E2E_BASE_URL: http://localhost:5173
      E2E_GATEWAY_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Установить браузер Playwright
        run: pnpm --filter @seatlock/e2e exec playwright install --with-deps chromium

      - name: Применить миграции к тестовым базам
        run: |
          pnpm --filter @seatlock/auth run prisma:deploy
          pnpm --filter @seatlock/catalog run prisma:deploy

      # Дев-режим (nest start --watch у 4 nest-приложений + vite сразу
      # для web) на живом прогоне CI ни разу не выдал ни строчки вывода
      # даже за 10 минут — холодная ts-node-компиляция четырёх сервисов
      # разом на общем CPU шарового раннера, судя по всему, попросту не
      # укладывается в разумное время. Собираем один раз (турбо-кэш это
      # уже проверенно быстро — см. предыдущие шаги "check"-джоба) и
      # запускаем готовый dist/ — почти мгновенный старт, ближе к тому,
      # как сервис поднимается в проде, и не завязан на скорость
      # компиляции конкретного раннера.
      - name: Собрать бэкенд и фронтенд
        run: pnpm build

      - name: Запустить весь стек в фоне
        run: |
          nohup node apps/auth/dist/main.js > /tmp/auth.log 2>&1 &
          nohup node apps/catalog/dist/main.js > /tmp/catalog.log 2>&1 &
          nohup node apps/booking/dist/main.js > /tmp/booking.log 2>&1 &
          nohup node apps/gateway/dist/main.js > /tmp/gateway.log 2>&1 &
          nohup pnpm --filter @seatlock/web exec vite preview --port 5173 --strictPort > /tmp/web.log 2>&1 &

      - name: Дождаться готовности всех сервисов
        run: |
          # --max-time — иначе один-единственный порт, который открылся,
          # но повис до ответа (не успел провалиться, не успел ответить),
          # блокирует curl навсегда и весь цикл перестаёт быть ограниченным
          # по времени вообще, несмотря на seq 1 N — ровно так один раз
          # уже зависло по-настоящему, а не просто долго молчало.
          for i in $(seq 1 60); do
            if curl -fs --max-time 3 http://localhost:5173/ >/dev/null \
              && curl -fs --max-time 3 http://localhost:3000/health >/dev/null \
              && curl -fs --max-time 3 http://localhost:3001/health >/dev/null \
              && curl -fs --max-time 3 http://localhost:3002/health >/dev/null \
              && curl -fs --max-time 3 http://localhost:3003/health >/dev/null; then
              echo "весь стек готов после ${i} попыток"
              exit 0
            fi
            if [ $((i % 10)) -eq 0 ]; then
              echo "--- попытка ${i}/60 ---"
              for svc in auth catalog booking gateway web; do
                echo "-- хвост /tmp/${svc}.log --"
                tail -n 15 "/tmp/${svc}.log" || true
              done
            fi
            sleep 2
          done
          echo "стек не поднялся за отведённое время — полные логи ниже"
          for svc in auth catalog booking gateway web; do
            echo "===== ${svc} ====="
            cat "/tmp/${svc}.log" || true
          done
          exit 1

      - name: E2E-тесты
        run: pnpm --filter @seatlock/e2e run test:e2e

      - name: Логи стека (если что-то упало)
        if: failure()
        run: |
          for svc in auth catalog booking gateway web; do
            echo "===== ${svc} ====="
            cat "/tmp/${svc}.log" || true
          done

      - name: Playwright-трейсы (если что-то упало)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: packages/e2e/test-results
          retention-days: 7
