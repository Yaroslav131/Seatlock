name: CD

on:
  push:
    branches: [main]
  # Позволяет перезапустить деплой вручную из вкладки Actions,
  # не создавая пустой коммит.
  workflow_dispatch:

concurrency:
  # Без group deploy'ы могли бы наложиться друг на друга, если пуши
  # в main идут быстрее, чем успевает отработать предыдущий деплой.
  group: cd-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/yaroslav131/seatlock-gateway

jobs:
  build-and-push:
    name: Собрать и опубликовать образ
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Сборка и пуш
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/gateway/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          # Кэш слоёв сборки живёт между запусками CI — повторная сборка
          # без изменений в зависимостях займёт секунды, а не минуты.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Развернуть на сервере
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Обновить контейнер по SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/seatlock

            # Токен GITHUB_TOKEN живёт только время одного запуска workflow —
            # на сервере он нигде не сохраняется постоянно, только на время pull.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Сервер клонирован как --single-branch, поэтому здесь нет
            # локальной ветки "main" и "origin/main" по имени — переключаемся
            # прямо на то, что скачал fetch, не полагаясь на имя ветки.
            git fetch origin main --quiet
            git checkout -B main --quiet FETCH_HEAD

            docker compose -f docker-compose.prod.yml pull gateway
            docker compose -f docker-compose.prod.yml up -d gateway
            docker image prune -f --filter "label!=keep"
            docker logout ghcr.io >/dev/null

      - name: Проверка /health/ready после деплоя
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # У gateway нет опубликованного порта на хост — снаружи
            # к нему обращается только Caddy по внутренней сети. Поэтому
            # проверяем не curl'ом с хоста, а собственным Docker HEALTHCHECK
            # контейнера — тем же самым, что описан в Dockerfile.
            for i in $(seq 1 10); do
              status=$(docker inspect --format '{{.State.Health.Status}}' seatlock-gateway-1)
              if [ "$status" = "healthy" ]; then
                echo "OK: контейнер healthy"
                exit 0
              fi
              sleep 3
            done
            echo "ОШИБКА: контейнер не стал healthy за 30 секунд после деплоя"
            docker logs seatlock-gateway-1 --tail 50
            exit 1
