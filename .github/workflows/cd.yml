name: CD

on:
  push:
    branches: [main]
  # Позволяет перезапустить деплой вручную из вкладки Actions,
  # не создавая пустой коммит.
  workflow_dispatch:

concurrency:
  # Без group deploy'ы могли бы наложиться друг на друга, если пуши
  # в main идут быстрее, чем успевает отработать предыдущий деплой.
  group: cd-production
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Собрать и опубликовать образы
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: gateway
            dockerfile: apps/gateway/Dockerfile
          - name: auth
            dockerfile: apps/auth/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Вход в ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и пуш ${{ matrix.service.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ghcr.io/yaroslav131/seatlock-${{ matrix.service.name }}:latest
            ghcr.io/yaroslav131/seatlock-${{ matrix.service.name }}:${{ github.sha }}
          # Кэш слоёв сборки живёт между запусками CI — повторная сборка
          # без изменений в зависимостях займёт секунды, а не минуты.
          # Свой scope на сервис — иначе кэш auth и gateway перезаписывали
          # бы друг друга.
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  build-and-deploy-web:
    name: Собрать и залить фронтенд
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Установка зависимостей
        run: pnpm install --frozen-lockfile

      - name: Сборка
        run: pnpm --filter @seatlock/web build

      - name: Залить на сервер
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # tar в stdout | ssh | tar из stdin — детерминированно распаковывает
          # содержимое dist прямо в web-dist, без сюрпризов с тем, как
          # сторонний SCP-экшен трактует глобы и вложенность папок.
          tar -C apps/web/dist -czf - . | \
            ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy_key deploy@"$DEPLOY_HOST" \
            'mkdir -p ~/seatlock/web-dist && tar -C ~/seatlock/web-dist -xzf -'

  deploy:
    name: Развернуть на сервере
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Обновить контейнеры по SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd ~/seatlock

            # Токен GITHUB_TOKEN живёт только время одного запуска workflow —
            # на сервере он нигде не сохраняется постоянно, только на время pull.
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Сервер клонирован как --single-branch, поэтому здесь нет
            # локальной ветки "main" и "origin/main" по имени — переключаемся
            # прямо на то, что скачал fetch, не полагаясь на имя ветки.
            git fetch origin main --quiet
            git checkout -B main --quiet FETCH_HEAD

            docker compose -f docker-compose.prod.yml pull auth gateway

            # Миграции — отдельным шагом, до запуска новых контейнеров,
            # а не при старте приложения (ADR 0001): несколько параллельных
            # реплик не должны наперегонки мигрировать одну и ту же базу.
            docker compose -f docker-compose.prod.yml run --rm auth npx prisma migrate deploy

            # caddy тоже в списке: сам образ не меняется, но docker compose
            # up сам заметит, если поменялось описание сервиса (например,
            # новый volume под статику фронтенда) и пересоздаст только его.
            docker compose -f docker-compose.prod.yml up -d auth gateway caddy
            docker image prune -f --filter "label!=keep"
            docker logout ghcr.io >/dev/null

      - name: Проверка здоровья после деплоя
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            # У сервисов нет опубликованных портов на хост — снаружи виден
            # только Caddy. Проверяем не curl'ом, а собственным Docker
            # HEALTHCHECK каждого контейнера.
            for name in seatlock-auth-1 seatlock-gateway-1; do
              ok=false
              for i in $(seq 1 10); do
                status=$(docker inspect --format '{{.State.Health.Status}}' "$name")
                if [ "$status" = "healthy" ]; then
                  echo "OK: $name healthy"
                  ok=true
                  break
                fi
                sleep 3
              done
              if [ "$ok" != "true" ]; then
                echo "ОШИБКА: $name не стал healthy за 30 секунд после деплоя"
                docker logs "$name" --tail 50
                exit 1
              fi
            done
