name: seatlock

services:
  postgres:
    image: postgres:17-alpine
    container_name: seatlock-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: seatlock
      POSTGRES_DB: seatlock
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatlock -d seatlock']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: seatlock-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6380:6379'
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: seatlock-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: seatlock
      RABBITMQ_DEFAULT_PASS: seatlock
    ports:
      - '5673:5672'
      - '15673:15672'
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: seatlock-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: seatlock
      MINIO_ROOT_PASSWORD: seatlock123
    ports:
      - '9100:9000'
      - '9101:9001'
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    container_name: seatlock-mailpit
    restart: unless-stopped
    ports:
      - '1026:1025'
      - '8026:8025'

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: seatlock-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4318:4318' # OTLP HTTP — сервисы (голые Node-процессы на хосте) шлют трейсы сюда

  prometheus:
    image: prom/prometheus:latest
    container_name: seatlock-prometheus
    restart: unless-stopped
    # --web.enable-remote-write-receiver — без него k6 не смог бы
    # пушить сюда свои метрики (--out experimental-prometheus-rw),
    # приём remote_write не включён по умолчанию.
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-remote-write-receiver'
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'
    # host.docker.internal нужен, чтобы достучаться до сервисов на
    # хосте (см. docker/prometheus.yml) — на Docker Desktop работает
    # само, extra_hosts здесь только ради переносимости на Linux.
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # Метрики самой машины и базы (этап 5). Node-экспортёр и cAdvisor в dev на Docker
  # Desktop показывают виртуальную машину Docker, а не ваш Windows/Mac, зато дашборд
  # «сервер и база» можно отладить локально до выката на прод.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: seatlock-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: seatlock-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - '--housekeeping_interval=15s'
      - '--docker_only=true'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.service'
      - '--disable_metrics=disk,diskIO,network,tcp,udp,percpu,sched,process,hugetlb,referenced_memory,cpu_topology,resctrl'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    container_name: seatlock-postgres-exporter
    restart: unless-stopped
    environment:
      # Так же, как в проде (docker-compose.prod.yml): пароль отдельной переменной.
      DATA_SOURCE_USER: seatlock
      DATA_SOURCE_PASS: seatlock
      DATA_SOURCE_URI: postgres:5432/seatlock?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: seatlock-grafana
    restart: unless-stopped
    environment:
      # Только для dev, только локально — не выносить эту настройку в
      # docker-compose.prod.yml без отдельного решения о том, кто вообще
      # должен видеть эти дашборды.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - '3006:3000'
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
