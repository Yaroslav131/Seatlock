packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  # Скрипт установки Prisma скачивает бинарник query-движка —
  # без него генерация клиента и миграции не работают.
  '@prisma/client': true
  '@prisma/engines': true
  # esbuild ставит нативный бинарник под конкретную ОС/архитектуру —
  # без этого шага Vite не соберётся вообще.
  esbuild: true
  prisma: true
