name: seatlock

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seatlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatlock -d seatlock']
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт наружу намеренно не публикуем — Postgres доступен только
    # другим контейнерам внутри этой compose-сети, не всему интернету.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    # Первый реальный потребитель — payment (transactional outbox).
    # До сих пор был поднят только в docker-compose.yml (дев), в проде
    # его не было вообще, потому что никто к нему не подключался.
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: seatlock
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем — доступен только другим контейнерам
    # этой compose-сети, тем же принципом, что postgres/redis.

  auth:
    image: ghcr.io/yaroslav131/seatlock-auth:latest
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_PORT: 3001
      # Своя схема внутри той же базы, что и у остальных сервисов — ADR 0001.
      AUTH_DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock?schema=auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # Контейнеры в одной compose-сети — по имени сервиса, а не
      # localhost/host.docker.internal, как в dev (там сервисы — голые
      # процессы на хосте, см. docker/prometheus.yml).
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Порт наружу не публикуем — снаружи виден только gateway,
    # он и проксирует /api/auth сюда по имени сервиса.

  catalog:
    image: ghcr.io/yaroslav131/seatlock-catalog:latest
    build:
      context: .
      dockerfile: apps/catalog/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      CATALOG_PORT: 3002
      CATALOG_DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock?schema=catalog
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Порт наружу не публикуем — снаружи виден только gateway.

  booking:
    image: ghcr.io/yaroslav131/seatlock-booking:latest
    build:
      context: .
      dockerfile: apps/booking/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BOOKING_PORT: 3003
      # Никакого *_DATABASE_URL — холды живут только в Redis, см. ADR 0003.
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      SEAT_HOLD_TTL_SECONDS: 300
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Порт наружу не публикуем — снаружи виден только gateway.

  payment:
    image: ghcr.io/yaroslav131/seatlock-payment:latest
    build:
      context: .
      dockerfile: apps/payment/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PAYMENT_PORT: 3004
      PAYMENT_DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock?schema=payment
      RABBITMQ_URL: amqp://seatlock:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Server-to-server: проверяет холд в booking и цену в catalog
      # напрямую, в обход gateway (см. комментарий в orders.service.ts).
      BOOKING_SERVICE_URL: http://booking:3003
      CATALOG_SERVICE_URL: http://catalog:3002
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      # fake — реальный провайдер ещё не выбран (Stripe недоступен из
      # Беларуси — санкции). См. apps/payment/src/providers.
      PAYMENT_PROVIDER: fake
      # Осознанный демо-режим: деньги не списываются (docs/adr/0004). Убрать
      # эту строку при подключении реального провайдера — без неё fake в
      # production не стартует.
      ALLOW_FAKE_PAYMENTS: 'true'
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Порт наружу не публикуем — снаружи виден только gateway, он же
    # проксирует и вебхук провайдера (сырые байты, см. apps/gateway/src/main.ts).

  minio:
    # S3-совместимое хранилище PDF-билетов для notification — свой
    # контейнер, а не платное облако (тот же принцип, что и весь
    # остальной стек, см. README "свой сервер вместо AWS"). Тот же
    # образ и healthcheck, что и в dev docker-compose.yml.
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: ['server', '/data']
    environment:
      MINIO_ROOT_USER: seatlock
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    # Порт наружу не публикуем — как Postgres/Redis/RabbitMQ, доступ
    # только другим контейнерам этой compose-сети.

  notification:
    image: ghcr.io/yaroslav131/seatlock-notification:latest
    build:
      context: .
      dockerfile: apps/notification/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NOTIFICATION_PORT: 3005
      NOTIFICATION_DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock?schema=notification
      RABBITMQ_URL: amqp://seatlock:${RABBITMQ_PASSWORD}@rabbitmq:5672
      # Server-to-server: email покупателя из auth, данные события/места
      # из catalog — напрямую, в обход gateway (тот же паттерн, что у
      # payment, см. orders.service.ts).
      AUTH_SERVICE_URL: http://auth:3001
      CATALOG_SERVICE_URL: http://catalog:3002
      # Внутренний порт контейнера (9000) — не тот, что замаплен наружу
      # в dev (9100). Один и тот же пользователь MinIO на всё — тем же
      # принципом, что общий Postgres-пользователь seatlock на все схемы.
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: seatlock
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: seatlock-tickets
      # Resend: обычный SMTP-релей, свой SDK не нужен (см. apps/notification/src/mail).
      SMTP_HOST: smtp.resend.com
      SMTP_PORT: 465
      SMTP_SECURE: 'true'
      SMTP_USER: resend
      SMTP_PASSWORD: ${RESEND_API_KEY}
      # Сколько писем обрабатывается одновременно (и сколько SMTP-соединений в пуле).
      # Потолок — лимит Resend, 10 запросов/с на команду, см. docs/adr/0006.
      NOTIFICATION_PREFETCH: 3
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    # Порт наружу не публикуем — как и payment, у notification нет
    # публичного HTTP API, gateway его не проксирует.

  # Две одинаковые реплики gateway за Caddy (см. Caddyfile): пока одна перезапускается
  # при деплое или упала, вторая принимает трафик. Пропускной способности вторая не
  # добавляет (на сервере два ядра, и они и так заняты сервисами), её задача, чтобы
  # деплой и падение одного процесса не были видны пользователям. Счётчики лимита
  # частоты лежат в Redis и общие для реплик, кеш у каждой свой.
  gateway: &gateway
    # image используется, когда CI когда-нибудь начнёт пушить готовые
    # образы в ghcr.io и мы перейдём на "docker compose pull". Сегодня,
    # на первом ручном деплое, реально работает build — собираем
    # прямо из склонированного на сервере репозитория.
    image: ghcr.io/yaroslav131/seatlock-gateway:latest
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      booking:
        condition: service_healthy
      payment:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      CORS_ORIGIN: https://seatlock.fun
      # Внутри compose-сети сервисы обращаются друг к другу по имени
      # сервиса ("postgres", "redis", "auth", "catalog"), а не по localhost.
      DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:3001
      CATALOG_SERVICE_URL: http://catalog:3002
      BOOKING_SERVICE_URL: http://booking:3003
      PAYMENT_SERVICE_URL: http://payment:3004
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      # Перед gateway стоит один прокси (Caddy): по нему определяется IP клиента для
      # лимита частоты. Если поставить ещё один слой (CDN, балансировщик), число надо увеличить.
      TRUST_PROXY_HOPS: 1
      # Адреса без лимита частоты через запятую, например свой нагрузочный генератор.
      # Пусто = лимит действует для всех. Задаётся в .env на сервере на время теста.
      RATE_LIMIT_BYPASS_IPS: ${RATE_LIMIT_BYPASS_IPS:-}

  gateway-2:
    <<: *gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Собранный фронтенд заливает сюда CD по SCP — обычная папка
      # с файлами на хосте, без отдельного контейнера. Обновление
      # файлов не требует перезапуска Caddy: file_server читает
      # их с диска при каждом запросе.
      - ./web-dist:/srv/web:ro
      # Отдельный том для сертификатов и состояния Caddy — при перезапуске
      # контейнера сертификат не перевыпускается заново с нуля.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    # Без depends_on на gateway: реплики перезапускаются по одной отдельным шагом деплоя
    # (см. .github/workflows/cd.yml), а Caddy сам проверяет их живость и не отправляет
    # трафик туда, где никто не отвечает.

  jaeger:
    image: jaegertracing/all-in-one:latest
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      # Только на loopback самого сервера — снаружи недоступно вообще,
      # смотреть через `ssh -L 16686:localhost:16686 deploy@<host>`.
      # Тот же принцип, что у остальных сервисов выше: единственный
      # публичный вход в систему — Caddy.
      - '127.0.0.1:16686:16686'
    # 4318 (приём OTLP от остальных контейнеров) на хост не публикуем —
    # сервисы шлют трейсы внутри этой же compose-сети по имени "jaeger".

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    # Никакого --web.enable-remote-write-receiver, как в dev — нагрузочные
    # тесты на прод не гоняем (см. packages/load-test/README.md), приём
    # remote_write снаружи здесь просто не нужен.

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    environment:
      # В отличие от dev — никакого анонимного admin-доступа. Пароль
      # берём из .env сервера (там же, где POSTGRES_PASSWORD и остальные
      # секреты) — его нужно завести туда вручную, в репозитории его нет.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - '127.0.0.1:3006:3000'
    depends_on:
      - prometheus
      - jaeger

volumes:
  pgdata:
  redisdata:
  rabbitdata:
  miniodata:
  caddy_data:
  caddy_config:
  prometheusdata:
  grafanadata:
