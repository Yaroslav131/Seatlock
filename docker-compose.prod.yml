name: seatlock

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: seatlock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: seatlock
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U seatlock -d seatlock']
      interval: 5s
      timeout: 3s
      retries: 10
    # Порт наружу намеренно не публикуем — Postgres доступен только
    # другим контейнерам внутри этой compose-сети, не всему интернету.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  auth:
    image: ghcr.io/yaroslav131/seatlock-auth:latest
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_PORT: 3001
      # Своя схема внутри той же базы, что и у остальных сервисов — ADR 0001.
      AUTH_DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock?schema=auth
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    # Порт наружу не публикуем — снаружи виден только gateway,
    # он и проксирует /api/auth сюда по имени сервиса.

  gateway:
    # image используется, когда CI когда-нибудь начнёт пушить готовые
    # образы в ghcr.io и мы перейдём на "docker compose pull". Сегодня,
    # на первом ручном деплое, реально работает build — собираем
    # прямо из склонированного на сервере репозитория.
    image: ghcr.io/yaroslav131/seatlock-gateway:latest
    build:
      context: .
      dockerfile: apps/gateway/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      NODE_ENV: production
      GATEWAY_PORT: 3000
      CORS_ORIGIN: https://seatlock.fun
      # Внутри compose-сети сервисы обращаются друг к другу по имени
      # сервиса ("postgres", "redis", "auth"), а не по localhost.
      DATABASE_URL: postgresql://seatlock:${POSTGRES_PASSWORD}@postgres:5432/seatlock
      REDIS_URL: redis://redis:6379
      AUTH_SERVICE_URL: http://auth:3001
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Собранный фронтенд заливает сюда CD по SCP — обычная папка
      # с файлами на хосте, без отдельного контейнера. Обновление
      # файлов не требует перезапуска Caddy: file_server читает
      # их с диска при каждом запросе.
      - ./web-dist:/srv/web:ro
      # Отдельный том для сертификатов и состояния Caddy — при перезапуске
      # контейнера сертификат не перевыпускается заново с нуля.
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_EMAIL: ${CADDY_EMAIL}
    depends_on:
      - gateway

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
